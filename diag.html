<!doctype html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnóstico MECA</title>
<style>
:root{color-scheme:dark}body{margin:0;padding:16px;background:#070707;color:#f2f2f2;font:15px/1.5 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 6px}p{color:#a1a1a1;margin:0 0 14px}
button{background:#e11d1d;color:#fff;border:0;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:700;width:100%;margin-bottom:10px}
button.sec{background:#2a2a2a}
pre{background:#111;border:1px solid #3a1313;border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;font-size:13px;min-height:80px}
.v{background:#1a0d0d;border:1px solid #e11d1d;border-radius:10px;padding:12px;margin-top:12px;font-size:15px}
</style></head><body>
<h1>Diagnóstico MECA · ligação ao servidor</h1>
<p>Abre esta página no mesmo navegador onde usas a app, depois de entrares com a tua conta. Carrega no botão e envia-me o resultado.</p>
<button id="go">EXECUTAR DIAGNÓSTICO</button>
<button id="cp" class="sec">COPIAR RESULTADO</button>
<pre id="out">Ainda não executado.</pre>
<div class="v" id="verdict" hidden></div>
<script>
const U='https://nunylrdqbhmlbprajcvy.supabase.co',K='sb_publishable_hMvOeHnMBCtPyP3L8lZauQ_9xkPtniV';
const REF=new URL(U).hostname.split('.')[0],out=document.getElementById('out'),vd=document.getElementById('verdict');
let L=[];const log=t=>{L.push(t);out.textContent=L.join('\n')};
function findSession(){let best=null;for(const st of [localStorage,sessionStorage]){try{for(let i=0;i<st.length;i++){const k=st.key(i);if(!/^sb-.*-auth-token$/.test(k))continue;const j=JSON.parse(st.getItem(k));const s=j&&j.access_token?j:(j&&j.currentSession)||null;if(s&&s.access_token&&(!best||(s.expires_at||0)>best.exp))best={token:s.access_token,exp:s.expires_at||0,email:(s.user&&s.user.email)||'',key:k}}}catch(e){}}return best}
const alg=t=>{try{return JSON.parse(atob(t.split('.')[0].replace(/-/g,'+').replace(/_/g,'/'))).alg}catch(e){return '?'}};
async function call(fn,mode,token){const url=U+'/functions/v1/'+fn;let opt;
 if(mode==='simple')opt={method:'POST',headers:{'Content-Type':'text/plain'},body:'{}'};
 else if(mode==='apikey')opt={method:'POST',headers:{'Content-Type':'application/json',apikey:K},body:'{}'};
 else opt={method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,apikey:K},body:JSON.stringify(fn==='meca-studio'?{prompt:''}:{messages:[]})};
 try{const r=await fetch(url,Object.assign(opt,{signal:AbortSignal.timeout(40000)}));let t='';try{t=(await r.text()).slice(0,110)}catch(e){}return{ok:true,status:r.status,text:t}}catch(e){return{ok:false,err:(e.name||'Erro')+': '+(e.message||'')}}}
const show=r=>r.ok?'RESPONDEU HTTP '+r.status+' '+r.text:'FALHOU ('+r.err+')';
document.getElementById('go').onclick=async()=>{
 L=[];vd.hidden=true;log('Início: '+new Date().toLocaleString('pt-PT'));log('Página: '+location.origin+location.pathname);log('');
 const S=findSession();let token='';
 if(!S)log('1) Sessão: NÃO ENCONTRADA');
 else{const left=Math.round((S.exp*1000-Date.now())/60000);token=S.token;log('1) Sessão: '+(S.email||'?')+', token '+alg(S.token)+', '+(left<0?'EXPIRADO há '+(-left)+' min':'válido mais '+left+' min'))}
 try{const r=await fetch(U+'/auth/v1/health',{headers:{apikey:K}});log('2) Servidor Supabase acessível: SIM (HTTP '+r.status+')')}catch(e){log('2) Servidor Supabase acessível: NÃO ('+e.name+')');vd.hidden=false;vd.textContent='Conclusão: o teu navegador não chega ao Supabase nesta rede.';L.push('Conclusão: sem acesso ao Supabase.');out.textContent=L.join('\n');return}
 const R={};
 for(const fn of ['meca-studio','dynamic-worker']){
  log('');log('Função '+fn+':');
  R[fn]={};
  for(const [m,label] of [['simple','a) pedido simples, sem cabeçalhos especiais'],['apikey','b) pedido JSON com apikey'],['full','c) pedido completo da app (com sessão)']]){
   R[fn][m]=await call(fn,m,token);log('   '+label+': '+show(R[fn][m]))}}
 const st=R['meca-studio'],w=R['dynamic-worker'];let v;
 if(!st.simple.ok&&!st.apikey.ok&&!st.full.ok)v='A meca-studio não devolve resposta legível em NENHUM dos três testes, nem o mais simples. Isso indica que a função não está a arrancar bem ou não responde com CORS. Verifica no painel se a última publicação terminou sem erro.';
 else if(st.simple.ok&&!st.apikey.ok)v='O pedido simples passa mas o pedido com cabeçalhos (apikey) falha: o pré-pedido CORS (OPTIONS) da meca-studio está a ser recusado. O código novo da função provavelmente não está publicado.';
 else if(st.apikey.ok&&!st.full.ok)v='Só falha quando vai a sessão (Authorization). O gateway recusa o cabeçalho Authorization para esta função.';
 else if(st.full.ok&&st.full.status===401)v='A função alcança-se mas recusa a sessão (401). '+(S&&S.exp*1000<Date.now()?'A tua sessão está expirada: sai da app, entra de novo e repete o teste.':'Mostra-me o texto do erro acima.');
 else if(st.full.ok)v='A meca-studio responde (HTTP '+st.full.status+') ao pedido completo. Se o Studio ainda falhar, o problema está na app e não na ligação.';
 else v='Resultado misto. Envia-me o texto completo.';
 if(S&&S.exp*1000<Date.now())v+=' (Atenção: sessão expirada, entra de novo na app e repete para um resultado fiável.)';
 vd.hidden=false;vd.textContent='Conclusão: '+v;L.push('');L.push('Conclusão: '+v);out.textContent=L.join('\n');
};
document.getElementById('cp').onclick=async()=>{try{await navigator.clipboard.writeText(out.textContent);document.getElementById('cp').textContent='COPIADO'}catch(e){const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);document.getElementById('cp').textContent='SELECCIONADO: copia manualmente'}};
</script></body></html>
